<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel private</title>
<meta name="description" content="Private license administration panel.">
<meta name="theme-color" content="#16a34a">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Panel private">
<meta property="og:url" content="https://k3dauth.apps.bot-hosting.cloud/panel">
<meta property="og:title" content="Panel private">
<meta property="og:description" content="Private license administration panel.">
<meta property="og:image" content="https://k3dauth.apps.bot-hosting.cloud/banner.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Panel private">
<meta name="twitter:description" content="Private license administration panel.">
<meta name="twitter:image" content="https://k3dauth.apps.bot-hosting.cloud/banner.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316a34a'/%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: #111214; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    color: #f5f6fa;
    padding: 32px;
  }
  body::before {
    content: "";
    position: fixed;
    inset: -30px;
    z-index: -1;
    background: url("/bg.webp") center / cover no-repeat;
    filter: blur(2px) brightness(0.5);
  }
  .wrap { width: 100%; }
  .narrow { max-width: 420px; margin: 12vh auto 0; }
  .card {
    background: rgb(24 25 27 / 0.85);
    border: 1px solid #26272b;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #aeb3bb;
    margin-bottom: 10px;
  }
  input, select {
    width: 100%;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid #26272b;
    background: #111214;
    color: #f5f6fa;
    font-size: 13px;
    font-family: inherit;
    outline: none;
  }
  input:focus, select:focus { border-color: #16a34a; }
  select option { background: #18191b; }
  .field { margin-bottom: 10px; }
  .field:last-child { margin-bottom: 0; }
  .grid { display: flex; gap: 10px; }
  .grid > * { flex: 1; min-width: 0; }
  button {
    cursor: pointer;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    padding: 9px 14px;
    transition: filter 0.15s;
  }
  button:hover { filter: brightness(1.15); }
  button:disabled { opacity: 0.5; pointer-events: none; }
  .btn-primary { background: #16a34a; color: #fff; border: 1px solid #16a34a; }
  .btn-secondary { background: #232324; color: #f5f6fa; border: 1px solid #26272b; }
  .btn-danger { background: transparent; color: #f87171; border: 1px solid #7f1d1d; padding: 5px 10px; font-size: 12px; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .msg {
    display: none;
    margin-top: 12px;
    font-size: 13px;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid #26272b;
    background: #18191b;
    color: #aeb3bb;
  }
  .msg.show { display: block; }
  .msg.ok { color: #4ade80; border-color: #14532d; }
  .msg.err { color: #f87171; border-color: #7f1d1d; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #7a7f87;
    padding: 8px 8px;
    border-bottom: 1px solid #26272b;
  }
  td { padding: 10px 8px; border-bottom: 1px solid #232426; }
  td.mono { font-family: Consolas, monospace; font-size: 12px; word-break: break-all; }
  tr:last-child td { border-bottom: none; }
  .pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 10px; border-radius: 6px; }
  .pill.pro { background: #16a34a; color: #fff; }
  .pill.free { background: #232324; color: #aeb3bb; border: 1px solid #26272b; }
  .rowbtns { display: flex; gap: 6px; justify-content: flex-end; white-space: nowrap; }
  .empty { text-align: center; color: #7a7f87; font-size: 13px; padding: 18px 0 6px; }
  .hidden { display: none; }
  .logo { height: 56px; display: block; margin: 0 auto 16px; }
  @media (max-width: 640px) {
    body { padding: 14px; }
    .card { padding: 14px; }
    .grid { flex-direction: column; }
    .narrow { margin: 8vh auto 0; }
    thead { display: none; }
    table, tbody, tr, td { display: block; width: 100%; }
    tbody tr { border: 1px solid #26272b; border-radius: 10px; margin-bottom: 10px; padding: 4px 12px; }
    tbody tr:last-child { margin-bottom: 0; }
    td { border-bottom: none; padding: 7px 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    td::before { content: attr(data-l); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: #7a7f87; }
    td.no-label { justify-content: flex-end; }
    td.no-label::before { content: none; }
    .rowbtns { width: 100%; }
    .rowbtns button { flex: 1; padding: 8px 6px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card narrow" id="loginCard">
    <img class="logo" src="/logo.png" alt="" onerror="this.remove()">
    <div class="field">
      <input id="key" type="password" placeholder="Admin key" autocomplete="current-password">
    </div>
    <div class="actions" style="margin-top:12px">
      <button class="btn-primary" id="loginBtn" style="flex:1">Sign in</button>
    </div>
    <div class="msg" id="loginMsg"></div>
  </div>

  <div id="panel" class="hidden">
    <div class="card">
      <div class="topbar">
        <div class="label" style="margin:0">Grant license</div>
        <button class="btn-secondary btn-sm" id="logoutBtn">Sign out</button>
      </div>
      <div class="field" style="margin-top:12px">
        <input id="hwid" type="text" placeholder="HWID from the app (Account page)" autocomplete="off" spellcheck="false">
      </div>
      <div class="grid">
        <select id="plan">
          <option value="pro">Pro</option>
          <option value="free">Free</option>
        </select>
        <button class="btn-primary" id="grantBtn">Apply</button>
      </div>
      <div class="msg" id="grantMsg"></div>
    </div>

    <div class="card">
      <div class="topbar">
        <div class="label" style="margin:0">Active licenses</div>
      </div>
      <div id="list" style="margin-top:6px"></div>
    </div>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const api = async (path, body) => {
    const res = await fetch(path, {
      method: body ? "POST" : "GET",
      headers: {
        "Content-Type": "application/json",
        "x-admin-key": sessionStorage.getItem("k3d_admin") || ""
      },
      body: body ? JSON.stringify(body) : undefined
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || ("Request failed (" + res.status + ")"));
    return data;
  };
  const note = (el, ok, text) => {
    el.className = "msg show " + (ok ? "ok" : "err");
    el.textContent = text;
  };

  async function loadList() {
    const box = $("list");
    try {
      const data = await api("/admin/hwids");
      const hwids = data.hwids || [];
      if (!hwids.length) {
        box.innerHTML = '<p class="empty">No licenses granted yet.</p>';
        return;
      }
      let html = "<table><thead><tr><th>HWID</th><th>Plan</th><th></th></tr></thead><tbody>";
      for (const h of hwids) {
        html += "<tr><td class=\"mono\" data-l=\"HWID\">" + esc(h.hwid) + "</td>"
          + "<td data-l=\"Plan\"><span class=\"pill " + h.plan + "\">" + h.plan.toUpperCase() + "</span></td>"
          + "<td class=\"no-label\"><div class=\"rowbtns\">"
          + "<button class=\"btn-secondary btn-sm\" data-act=\"pro\" data-hwid=\"" + esc(h.hwid) + "\">Pro</button>"
          + "<button class=\"btn-secondary btn-sm\" data-act=\"free\" data-hwid=\"" + esc(h.hwid) + "\">Free</button>"
          + "<button class=\"btn-danger\" data-act=\"del\" data-hwid=\"" + esc(h.hwid) + "\">Delete</button>"
          + "</div></td></tr>";
      }
      box.innerHTML = html + "</tbody></table>";
      box.querySelectorAll("button[data-act]").forEach((b) => {
        b.onclick = async () => {
          const target = b.getAttribute("data-hwid");
          const act = b.getAttribute("data-act");
          try {
            if (act === "del") await api("/admin/revoke", { hwid: target });
            else await api("/admin/grant", { hwid: target, plan: act });
            loadList();
          } catch (e) {
            note($("grantMsg"), false, e.message);
          }
        };
      });
    } catch (e) {
      box.innerHTML = '<p class="empty">Could not load licenses.</p>';
    }
  }

  function showPanel() {
    $("loginCard").classList.add("hidden");
    $("panel").classList.remove("hidden");
    loadList();
    setInterval(() => {
      if (!$("panel").classList.contains("hidden")) loadList();
    }, 15000);
  }

  $("loginBtn").onclick = async () => {
    const key = $("key").value.trim();
    if (!key) return;
    sessionStorage.setItem("k3d_admin", key);
    try {
      await api("/admin/verify", {});
      $("key").value = "";
      showPanel();
    } catch (e) {
      sessionStorage.removeItem("k3d_admin");
      note($("loginMsg"), false, "Invalid admin key.");
    }
  };
  $("key").addEventListener("keydown", (e) => { if (e.key === "Enter") $("loginBtn").click(); });

  $("logoutBtn").onclick = () => {
    sessionStorage.removeItem("k3d_admin");
    $("panel").classList.add("hidden");
    $("loginCard").classList.remove("hidden");
  };

  $("grantBtn").onclick = async () => {
    const hwid = $("hwid").value.trim();
    if (!hwid) {
      note($("grantMsg"), false, "Paste a HWID first.");
      return;
    }
    try {
      const r = await api("/admin/grant", { hwid: hwid, plan: $("plan").value });
      note($("grantMsg"), true, r.plan.toUpperCase() + " granted for " + r.hwid + ". The app picks it up automatically.");
      $("hwid").value = "";
      loadList();
    } catch (e) {
      note($("grantMsg"), false, e.message);
    }
  };

  (async () => {
    if (!sessionStorage.getItem("k3d_admin")) return;
    try {
      await api("/admin/verify", {});
      showPanel();
    } catch (e) {
      sessionStorage.removeItem("k3d_admin");
    }
  })();
</script>
</body>
</html>
