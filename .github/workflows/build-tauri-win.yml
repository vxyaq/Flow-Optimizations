name: Build Tauri Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "tauri-v*"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tauri-app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: tauri-app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --ignore-workspace --frozen-lockfile
      - run: pnpm exec tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: k3d-tauri-windows
          path: |
            tauri-app/src-tauri/target/release/bundle/nsis/*.exe
